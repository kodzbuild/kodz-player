name: Build Kodz Player

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk KodzPlayer.apk

      - name: Enviar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: KodzPlayer-apk
          path: KodzPlayer.apk

      - name: Publicar Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: KodzPlayer.apk
